<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean Cafe</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Bean Cafe</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>


    <section id="home" class="hero">
        <div>
            <h1>Fresh Coffee, Happy Moments</h1>
            <p>Enjoy your favorite coffee in a cozy place.</p>

            <button onclick="orderCoffee()">Order Now</button>
        </div>
    </section>


    <section id="menu" class="menu">
        <h2>Our Menu</h2>

        <div class="items">

            <div class="item">
                <span>☕</span>
                <h3>Cappuccino</h3>
                <p>Rs. 350</p>
            </div>

            <div class="item">
                <span>🍵</span>
                <h3>Green Tea</h3>
                <p>Rs. 250</p>
            </div>

            <div class="item">
                <span>🥐</span>
                <h3>Fresh Croissant</h3>
                <p>Rs. 300</p>
            </div>

        </div>
    </section>


    <section id="contact" class="contact">
        <h2>Visit Us</h2>
        <p>123 Main Street, Dadu</p>
        <p>Open Daily: 9 AM - 10 PM</p>
    </section>


    <footer>
        <p>© 2026 Bean Cafe</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
